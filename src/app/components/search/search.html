<app-header></app-header>
<div class="search-results-container">
  <div class="container mt-4">
 

    <h2 class="search-title">Résultats de recherche pour "{{ searchTerm }}"</h2>

    @if (filteredGames.length > 0) {
      <div class="search-results-grid">
        @for (game of filteredGames; track game.id) {
          <div class="game-card">
            <div class="card-image-wrapper" (click)="viewGameDetails(game.id)">
              <img [src]="game.coverImage" class="card-img-top" [alt]="game.title">
              <div class="image-overlay"></div>
            </div>
            <div class="card-body">
              <h5 class="card-title" (click)="viewGameDetails(game.id)">{{ game.title }}</h5>
              <p class="card-text">{{ game.description }}</p>
              <div class="card-footer">
                <span class="card-price">{{ game.price }} DT</span>
                <button class="btn-view-details" (click)="viewGameDetails(game.id)">
                  <i class="fas fa-eye"></i>
                  Voir détails
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="empty-results">
        <div class="empty-icon">
          <i class="fas fa-search"></i>
        </div>
        <h3>Aucun résultat trouvé</h3>
        <p>Aucun résultat trouvé pour "{{ searchTerm }}".</p>
        <button class="btn-secondary" (click)="goHome()">
          <i class="fas fa-home"></i>
          Retour à l'accueil
        </button>
      </div>
    }
  </div>
</div>
<app-footer></app-footer>
