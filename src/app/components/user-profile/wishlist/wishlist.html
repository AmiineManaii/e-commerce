<div class="wishlist-container">
  <div class="wishlist-card">
    <h2>Ma liste de souhaits</h2>
    
    <div *ngIf="loading" class="loading">
      Chargement de votre liste de souhaits...
    </div>
    
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
    
    <div *ngIf="!loading && !error && wishlistItems.length === 0" class="no-items">
      <p>Votre liste de souhaits est vide.</p>
      <a routerLink="/products" class="btn btn-primary">Découvrir des jeux</a>
    </div>
    
    <div *ngIf="!loading && wishlistItems.length > 0" class="wishlist-items">
      <div class="game-card" *ngFor="let game of wishlistItems">
        <div class="game-image">
          <img [src]=game.cover_image [alt]="game.title" *ngIf="game.cover_image">
          <div class="no-image" *ngIf="!game.cover_image">Image non disponible</div>
        </div>
        
        <div class="game-info">
          <h3 class="game-title">{{ game.title }}</h3>
          <p class="game-price">{{ game.price | currency:'EUR' }}</p>
          
          <div class="game-actions">
            <a [routerLink]="['/produitDetails', game.id]" class="btn btn-info">Voir détails</a>
            <button class="btn btn-danger" (click)="removeFromWishlist(game.id)">Retirer</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
